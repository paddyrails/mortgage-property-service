name: 4. Invoke APIs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      test_type:
        description: 'Type of test'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, full, crud]

env:
  SERVICE_NAME: property-service
  OPENSHIFT_NAMESPACE: mortgage-app

jobs:
  invoke-apis:
    name: Invoke APIs
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: sudo apt-get install -y jq

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"

      - name: Login to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Get Service URL
        id: get-url
        run: |
          ROUTE_URL=$(oc get route ${{ env.SERVICE_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}')
          echo "service_url=https://${ROUTE_URL}" >> $GITHUB_OUTPUT

      - name: Smoke Tests
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "🔥 Running Smoke Tests..."
          
          echo "GET /api/health"
          curl -s "${SERVICE_URL}/api/health" | jq .
          
          echo "GET /api/properties"
          curl -s "${SERVICE_URL}/api/properties" | jq '.data | length' | xargs -I {} echo "Found {} properties"

      - name: CRUD Tests
        if: github.event.inputs.test_type == 'full' || github.event.inputs.test_type == 'crud'
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "🧪 Running CRUD Tests..."
          
          # CREATE
          echo "=== CREATE Property ==="
          RESPONSE=$(curl -s -X POST "${SERVICE_URL}/api/properties" \
            -H "Content-Type: application/json" \
            -d '{
              "street": "999 Test Lane",
              "city": "Test City",
              "state": "CA",
              "zipCode": "90210",
              "propertyType": 1,
              "occupancyType": 1,
              "yearBuilt": 2020,
              "squareFeet": 2000,
              "lotSize": 0.5,
              "bedrooms": 3,
              "bathrooms": 2,
              "listingPrice": 500000,
              "estimatedValue": 495000
            }')
          echo "$RESPONSE" | jq .
          PROPERTY_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          
          if [ "$PROPERTY_ID" != "null" ]; then
            # READ
            echo "=== READ Property ==="
            curl -s "${SERVICE_URL}/api/properties/${PROPERTY_ID}" | jq .
            
            # UPDATE
            echo "=== UPDATE Property ==="
            curl -s -X PUT "${SERVICE_URL}/api/properties/${PROPERTY_ID}" \
              -H "Content-Type: application/json" \
              -d '{"listingPrice": 525000}' | jq .
            
            # DELETE
            echo "=== DELETE Property ==="
            curl -s -X DELETE "${SERVICE_URL}/api/properties/${PROPERTY_ID}" | jq .
          fi

      - name: Test Search
        if: github.event.inputs.test_type == 'full'
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "=== Search Properties ==="
          curl -s "${SERVICE_URL}/api/properties/search?city=San%20Francisco" | jq .

      - name: Summary
        run: |
          echo "## 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Service: ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Type: ${{ github.event.inputs.test_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.get-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
